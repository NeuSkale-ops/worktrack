name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard
          path: web/dist
          if-no-files-found: error
          retention-days: 7
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: worktrack_test
          POSTGRES_USER: worktrack
          POSTGRES_PASSWORD: ci-only-not-a-secret
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U worktrack -d worktrack_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://worktrack:ci-only-not-a-secret@localhost:5432/worktrack_test?sslmode=disable
      WT_TEST_DATABASE_URL: postgres://worktrack:ci-only-not-a-secret@localhost:5432/worktrack_test?sslmode=disable
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build -o "$RUNNER_TEMP/worktrack-api" .
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Real HTTP API integration
        working-directory: .
        env:
          WT_TEST_BASE: http://127.0.0.1:8080
          WT_TEST_OWNER_EMAIL: owner@example.test
          WT_TEST_OWNER_PASSWORD: ci-only-disposable-password
          APP_ORIGIN: http://localhost:5173
          LISTEN_ADDR: '127.0.0.1:8080'
          DEV_MODE: 'true'
        run: |
          BOOTSTRAP_EMAIL="$WT_TEST_OWNER_EMAIL" BOOTSTRAP_PASSWORD="$WT_TEST_OWNER_PASSWORD" BOOTSTRAP_NAME='CI owner' \
            "$RUNNER_TEMP/worktrack-api" >"$RUNNER_TEMP/worktrack-api.log" 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true; cat "$RUNNER_TEMP/worktrack-api.log"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent "$WT_TEST_BASE/api/health"; then break; fi
            if [ "$attempt" = 30 ]; then exit 1; fi
            sleep 1
          done
          node scripts/integration.mjs
  deployment-config:
    runs-on: ubuntu-latest
    env:
      APP_DOMAIN: worktrack.example.com
      ACME_EMAIL: ops@example.com
      POSTGRES_PASSWORD: validation-only
      DATABASE_URL: postgres://worktrack:validation-only@db:5432/worktrack?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f deploy/compose.yaml config --quiet
      - run: bash -n deploy/backup.sh deploy/test-web.sh
      - name: Validate Caddy configuration
        run: >-
          docker run --rm -e APP_DOMAIN -e ACME_EMAIL
          -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - run: docker build --target api -f deploy/Dockerfile .
      - run: docker build --target web -t worktrack-web:test -f deploy/Dockerfile .
      - run: bash deploy/test-web.sh
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install public updater signature verifier
        run: sudo apt-get update && sudo apt-get install --yes minisign
      - name: Keyless updater release safety tests
        run: python -m unittest discover -s scripts -p 'test_updater*.py' -v
      - name: Real Caddy updater hosting acceptance
        env:
          JCODE_SCRATCH_DIR: ${{ runner.temp }}
        run: bash scripts/test_updater_hosting.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Production HTTPS container acceptance
        env:
          JCODE_SCRATCH_DIR: ${{ runner.temp }}
        run: bash scripts/container-acceptance.sh
