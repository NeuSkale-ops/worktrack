name: Windows updater release
on:
  workflow_dispatch:
    inputs:
      channel:
        description: Isolated staging first, production only after real upgrade evidence
        type: choice
        options: [staging, production]
        default: staging
      version:
        description: Committed stable Tauri version (no v prefix)
        required: true
        type: string
      notes:
        description: Worker-facing notes for a new build, retained unchanged when reusing a candidate
        required: true
        type: string
      candidate_run:
        description: Optional completed signed-build run to retest exact bytes without rebuilding
        required: false
        type: string
      publish:
        description: Publish publicly after the separate production environment approval
        default: false
        type: boolean
      upgrade_evidence:
        description: Required for publication, reference to signed Windows upgrade and data-preservation evidence
        required: false
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: windows-updater-release
  cancel-in-progress: false
jobs:
  macos-preview:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/macos-preview.yml
    permissions:
      contents: read
    # Isolated preview build. Never inherits Windows signing or deploy secrets.
  build:
    if: github.ref == 'refs/heads/main' && inputs.candidate_run == ''
    environment: updater-release
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: agent/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: agent/pnpm-lock.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate release configuration before signing access
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RELEASE_NOTES: ${{ inputs.notes }}
          PUBLISH_REQUESTED: ${{ inputs.publish }}
          UPGRADE_EVIDENCE: ${{ inputs.upgrade_evidence }}
        shell: pwsh
        run: |
          if ($env:PUBLISH_REQUESTED -eq 'true' -and $env:RELEASE_CHANNEL -eq 'production' -and [string]::IsNullOrWhiteSpace($env:UPGRADE_EVIDENCE)) { throw 'Production publication requires real Windows upgrade evidence. Use publish=false for a private candidate.' }
          python scripts/updater_release.py config --config agent/src-tauri/tauri.conf.json --version $env:RELEASE_VERSION --channel $env:RELEASE_CHANNEL --output deploy/windows-release.generated.json
          if ($LASTEXITCODE -ne 0) { throw 'Release configuration is not ready' }
          [IO.File]::WriteAllText("$pwd/release-notes.txt", $env:RELEASE_NOTES)
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - run: rustup default stable
      - run: pnpm install --frozen-lockfile
        working-directory: agent
      - name: Test backend and release plumbing
        shell: pwsh
        run: |
          python -m unittest discover -s scripts -p 'test_updater*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Release plumbing tests failed' }
          cargo test --locked --manifest-path agent/src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'Backend tests failed' }
      # These are environment secrets, never repository secrets or push-job env.
      - name: Build signed updater artifacts
        working-directory: agent
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: pwsh
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY -or -not $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD) { throw 'Protected signing secrets are missing' }
          pnpm run tauri build --bundles nsis --target x86_64-pc-windows-msvc --config ../deploy/windows-release.generated.json -- --locked
          if ($LASTEXITCODE -ne 0) { throw 'Signed build failed' }
      - name: Smoke-test exact signed installer
        shell: pwsh
        run: ./scripts/updater_install_smoke.ps1 -Bundle agent/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis
      - name: Package candidate without publishing
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
        shell: pwsh
        run: |
          python scripts/updater_release.py package --config agent/src-tauri/tauri.conf.json --version $env:RELEASE_VERSION --channel $env:RELEASE_CHANNEL --bundle agent/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis --notes release-notes.txt --output updater-candidate.tar --public-key updater-public-key.txt
          if ($LASTEXITCODE -ne 0) { throw 'Candidate packaging failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: updater-candidate
          path: |
            updater-candidate.tar
            updater-public-key.txt
          if-no-files-found: error
          retention-days: 30
  verify:
    needs: build
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' &&
      (needs.build.result == 'success' || inputs.candidate_run != '')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate configuration and reused candidate provenance
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          PUBLISH_REQUESTED: ${{ inputs.publish }}
          UPGRADE_EVIDENCE: ${{ inputs.upgrade_evidence }}
        run: |
          set -euo pipefail
          if [[ "$PUBLISH_REQUESTED" == true && "$RELEASE_CHANNEL" == production && ! "$UPGRADE_EVIDENCE" =~ [^[:space:]] ]]; then
            echo 'Production publication requires real Windows upgrade evidence.' >&2
            exit 1
          fi
          python scripts/updater_release.py config --config agent/src-tauri/tauri.conf.json --version "$RELEASE_VERSION" --channel "$RELEASE_CHANNEL" --output "$RUNNER_TEMP/windows-release.generated.json"
          if [[ -n "$CANDIDATE_RUN" ]]; then
            [[ "$CANDIDATE_RUN" =~ ^[1-9][0-9]*$ ]]
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN" > "$RUNNER_TEMP/candidate-run.json"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN/jobs?per_page=100" > "$RUNNER_TEMP/candidate-jobs.json"
            source_sha=$(python -c 'import json,os,pathlib; root=pathlib.Path(os.environ["RUNNER_TEMP"]); run=json.loads((root/"candidate-run.json").read_text()); jobs=json.loads((root/"candidate-jobs.json").read_text())["jobs"]; assert (run["head_repository"]["full_name"],run["head_branch"],run["event"],run["path"],run["status"]) == (os.environ["GITHUB_REPOSITORY"],"main","workflow_dispatch",".github/workflows/updater-release.yml","completed"), "Untrusted candidate source"; assert all(any(job["name"] == name and job["conclusion"] == "success" for job in jobs) for name in ("build","verify")), "Original signed build and independent verification must pass"; print(run["head_sha"])')
            [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
            # Test-only or workflow fixes may change, but built application/release code may not.
            if ! git diff --quiet "$source_sha" HEAD -- agent scripts/updater_release.py; then
              echo 'Candidate application or release code differs from this revision. Build a new candidate.' >&2
              exit 1
            fi
          fi
      - uses: actions/download-artifact@v4
        with:
          name: updater-candidate
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate_run || github.run_id }}
      - name: Install public signature verifier
        run: sudo apt-get update && sudo apt-get install --yes minisign
      - name: Verify exact installer, trusted version, signature and checksum
        env:
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python -c 'import json,pathlib; expected=json.loads(pathlib.Path("agent/src-tauri/tauri.conf.json").read_text())["plugins"]["updater"]["pubkey"]; actual=pathlib.Path("updater-public-key.txt").read_text().strip(); assert actual == expected, "Candidate key differs from committed trust anchor"'
          python scripts/updater_release.py verify --archive updater-candidate.tar --public-key updater-public-key.txt --channel "$RELEASE_CHANNEL"
          python -c 'import json,os,tarfile; archive=tarfile.open("updater-candidate.tar"); assert json.load(archive.extractfile("latest.json"))["version"] == os.environ["RELEASE_VERSION"], "Candidate version differs from requested release"'
  upgrade:
    needs: verify
    if: >-
      !cancelled() && needs.verify.result == 'success' && inputs.channel == 'production'
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: updater-candidate
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate_run || github.run_id }}
      - name: Download immutable signed baseline
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $baseline = Join-Path $env:RUNNER_TEMP 'worktrack-baseline-0.1.5.exe'
          Invoke-WebRequest 'https://worktrack.178.156.213.40.sslip.io/downloads/0.1.5/WorkTrack_0.1.5_x64-setup.exe' -OutFile $baseline
          if ((Get-FileHash $baseline -Algorithm SHA256).Hash.ToLowerInvariant() -ne '0ed92d211340e34d9228b5d3d434e6463ac8507102f3a2ac85ad633479935638') { throw 'Baseline differs from the previously verified signed installer' }
      - name: Exercise actual installed Windows in-app upgrade and recovery
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        shell: pwsh
        run: |
          ./scripts/updater_upgrade_acceptance.ps1 -Candidate "$pwd/updater-candidate.tar" -Baseline "$env:RUNNER_TEMP/worktrack-baseline-0.1.5.exe" -ExpectedVersion $env:RELEASE_VERSION
      - name: Retain native upgrade evidence without credentials or certificates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-upgrade-evidence
          path: ${{ runner.temp }}/worktrack-upgrade-evidence/upgrade-evidence.json
          if-no-files-found: warn
          retention-days: 30
  publish:
    needs: [verify, upgrade, macos-preview]
    if: >-
      !cancelled() && needs.verify.result == 'success' && needs.macos-preview.result == 'success' &&
      (inputs.channel == 'staging' || needs.upgrade.result == 'success') &&
      inputs.publish && (inputs.channel == 'staging' || inputs.upgrade_evidence != '') &&
      github.ref == 'refs/heads/main'
    environment: ${{ inputs.channel == 'production' && 'updater-production' || 'updater-staging' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: updater-candidate
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate_run || github.run_id }}
      - name: Publish with restricted SSH identity
        env:
          WORKTRACK_UPDATER_SSH_KEY: ${{ secrets.WORKTRACK_UPDATER_SSH_KEY }}
          WORKTRACK_UPDATER_KNOWN_HOSTS: ${{ vars.WORKTRACK_UPDATER_KNOWN_HOSTS }}
          WORKTRACK_UPDATER_HOST: ${{ vars.WORKTRACK_UPDATER_HOST }}
          # Restricted receiver sshd. Admin SSH on 22 is firewalled to operators.
          WORKTRACK_UPDATER_PORT: ${{ vars.WORKTRACK_UPDATER_PORT || '22' }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          UPGRADE_EVIDENCE: ${{ inputs.upgrade_evidence }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$WORKTRACK_UPDATER_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]+$ ]]
          test -n "$WORKTRACK_UPDATER_SSH_KEY"
          test -n "$WORKTRACK_UPDATER_KNOWN_HOSTS"
          if [[ "$RELEASE_CHANNEL" == production ]]; then test -n "$UPGRADE_EVIDENCE"; fi
          umask 077
          key="$RUNNER_TEMP/updater-deploy-key"
          hosts="$RUNNER_TEMP/updater-known-hosts"
          trap 'rm -f "$key" "$hosts"' EXIT
          printf '%s\n' "$WORKTRACK_UPDATER_SSH_KEY" > "$key"
          printf '%s\n' "$WORKTRACK_UPDATER_KNOWN_HOSTS" > "$hosts"
          user=worktrack-updates
          if [[ "$RELEASE_CHANNEL" == staging ]]; then user=worktrack-updates-staging; fi
          # The server forces the receiver command. No shell, scp, sudo or root.
          [[ "$WORKTRACK_UPDATER_PORT" =~ ^[0-9]{1,5}$ ]]
          ssh -T -o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            -o "UserKnownHostsFile=$hosts" -o ConnectTimeout=15 -i "$key" -p "$WORKTRACK_UPDATER_PORT" \
            "$user@$WORKTRACK_UPDATER_HOST" < updater-candidate.tar
