# Server deploy: build api + web images, push to GHCR, record the tag in
# NeuSkale-ops/infra. Flux on the app-nbg k3s cluster rolls it out.
#
# Release branch model (same as neuskale-oms): push to `deploy` to ship.
#     git switch deploy && git merge --ff-only main && git push
# The API applies its own schema migrations at startup.
# Roll back by reverting the tag commit in the infra repo.
#
# Secrets: INFRA_DEPLOY_KEY (write deploy key of NeuSkale-ops/infra).
name: Deploy

on:
  push:
    branches: [deploy]
    paths: [server/**, web/**, deploy/Dockerfile, deploy/Dockerfile.dockerignore, deploy/Caddyfile]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: api
          push: true
          tags: ghcr.io/neuskale-ops/worktrack-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: web
          push: true
          tags: ghcr.io/neuskale-ops/worktrack-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: NeuSkale-ops/infra
          ssh-key: ${{ secrets.INFRA_DEPLOY_KEY }}
      - name: Bump image tags in infra
        run: |
          git config user.name "worktrack ci"
          git config user.email "ci@neuskale.com"
          scripts/bump-image.sh apps/neuskale/worktrack "${{ github.sha }}" worktrack-api worktrack-web
      - name: Smoke test
        run: |
          sleep 90
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 https://worktrack.neuskale.com/ || true)
            echo "attempt $i: / -> $code"
            [ "$code" = 200 ] && exit 0
            sleep 10
          done
          echo "::error::worktrack not healthy after deploy"
          exit 1
