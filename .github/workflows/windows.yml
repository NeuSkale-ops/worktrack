name: Windows agent
on:
  pull_request:
    paths:
      - 'agent/**'
      - '.github/workflows/windows.yml'
      - 'deploy/windows-ci.json'
  push:
    branches: [main]
    paths:
      - 'agent/**'
      - '.github/workflows/windows.yml'
      - 'deploy/windows-ci.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  nsis:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: agent/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: agent/pnpm-lock.yaml
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - run: rustup default stable
      - run: pnpm install --frozen-lockfile
      - run: cargo check --locked --manifest-path src-tauri/Cargo.toml --all-targets
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build unsigned NSIS installer without updater artifacts
        run: pnpm run tauri build --bundles nsis --config ../deploy/windows-ci.json
      - uses: actions/upload-artifact@v4
        with:
          name: windows-nsis-unsigned
          path: agent/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 7
