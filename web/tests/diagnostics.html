<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><title>Diagnostic log UI checks</title><style>#results{white-space:pre-wrap}body>aside{padding:16px}</style></head>
<body>
<aside><h1>Diagnostic log UI checks (mock API)</h1><pre id="results">Running…</pre></aside>
<div id="root"></div>
<script type="module">
const today = new Intl.DateTimeFormat('en-CA', { year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
const role = new URLSearchParams(location.search).get('role') || 'owner';
if (!['owner', 'manager', 'worker'].includes(role)) throw new Error('Unknown test role');
const user = { id: '00000000-0000-4000-8000-000000000001', email: 'fixture@example.test', name: 'Fixture', role };
let logCalls = 0;
let dayCalls = 0;
let mode = 'events';
let timelineError = false;
const screenshotCanvas = document.createElement('canvas');
screenshotCanvas.width = screenshotCanvas.height = 1;
let screenshotImage = screenshotCanvas.toDataURL('image/jpeg');
window.fetch = async input => {
  const path = String(input);
  if (path === '/api/auth/me') return Response.json(user);
  if (path === '/updates/windows/x86_64/latest.json') return Response.json({version:'0.1.7', platforms:{'windows-x86_64':{url:`${location.origin}/updates/windows/x86_64/releases/0.1.7/worktrack-setup.exe`}}});
  if (path === '/api/team') return Response.json([user, { id: '00000000-0000-4000-8000-000000000009', email: 'w@example.test', name: 'Second Worker', role: 'worker', working: true, last_seen_at: null }]);
  if (path.startsWith('/api/reports/day?')) { dayCalls++; if (role === 'worker') throw new Error('Workers must not fetch the team day report'); return Response.json([{ user_id: user.id, start_at: `${today}T12:00:00Z`, end_at: `${today}T12:10:00Z`, screenshot: true }, { user_id: '00000000-0000-4000-8000-000000000009', start_at: `${today}T09:00:00Z`, end_at: `${today}T09:30:00Z`, screenshot: false }]); }
  if (path.startsWith('/api/reports/hours?')) return Response.json([]);
  if (path.startsWith('/api/timeline?') && timelineError) return Response.json({error:'Day could not be loaded'}, {status:503});
  if (path.startsWith('/api/timeline?') && new URLSearchParams(path.split('?')[1]).get('user') !== user.id) return Response.json([]);
  if (path.startsWith('/api/timeline?')) return Response.json([
    { id:'one', user_id:user.id, start_at:`${today}T12:00:00Z`, end_at:`${today}T12:01:00Z`, duration_seconds:60, active_seconds:30, screenshot_url:screenshotImage, screenshot_status:'available', location:{status:'available',captured_at:`${today}T12:01:00Z`,latitude:0,longitude:0,accuracy_m:25,observed_at:`${today}T12:01:01Z`}, application_usage:[{app:'chrome.exe',milliseconds:60000}] },
    { id:'two', user_id:user.id, start_at:`${today}T12:01:00Z`, end_at:`${today}T12:02:00Z`, duration_seconds:60, active_seconds:30, screenshot_url:null, screenshot_status:'unavailable', location:{status:'unavailable',captured_at:`${today}T12:02:00Z`}, application_usage:[{app:'chrome.exe',milliseconds:30000},{app:'code.exe',milliseconds:30000}] },
    { id:'three', user_id:user.id, start_at:`${today}T12:02:00Z`, end_at:`${today}T12:02:30Z`, duration_seconds:30, active_seconds:10, screenshot_url:screenshotImage, screenshot_status:'available', location:{status:'disabled',captured_at:`${today}T12:02:30Z`}, application_usage:[] },
    { id:'four', user_id:user.id, start_at:`${today}T12:02:30Z`, end_at:`${today}T12:03:00Z`, duration_seconds:30, active_seconds:10, screenshot_url:null, screenshot_status:'not_captured', location:null, application_usage:[] },
    { id:'five', user_id:user.id, start_at:`${today}T12:03:00Z`, end_at:`${today}T12:03:30Z`, duration_seconds:30, active_seconds:10, screenshot_url:null, screenshot_status:'deleted', location:null, application_usage:[] },
  ]);
  if (path === '/api/sessions/current') return Response.json(null);
  if (path === '/api/agent/logs') {
    logCalls++;
    if (role !== 'owner') throw new Error('Non-owner must not fetch diagnostics');
    if (mode === 'error') return Response.json({ error: 'Diagnostics unavailable' }, { status: 503 });
    return Response.json(mode === 'empty' ? [] : [{
      id: '00000000-0000-4000-8000-000000000002', user_id: user.id,
      name: '<img src=x onerror=alert(1)>', occurred_at: `${today}T12:00:00Z`,
      version: '0.1.2', code: 'sync_failed', level: 'warn',
      message: 'Tracking data could not be synced.', status: 503,
    }]);
  }
  throw new Error(`Unexpected API request: ${path}`);
};
const checks = [];
const results = document.querySelector('#results');
const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
async function check(description, predicate) {
  const deadline = Date.now() + 10000;
  while (!predicate()) {
    if (Date.now() > deadline) throw new Error(`Timed out: ${description}`);
    await wait(25);
  }
  checks.push(description);
  results.textContent = checks.map(name => `PASS ${name}`).join('\n');
}
try {
  await import('/src/main.tsx');
  const click = text => {
    const button = [...document.querySelectorAll('button')].find(b => b.textContent.trim() === text);
    if (!button) throw new Error(`Missing button: ${text}`);
    button.click();
  };
  await check('real dashboard loaded in screenshot-first day view with named timeline graphic', () => Boolean(document.querySelector('.page-heading')) && Boolean(document.querySelector('.day-timeline[role=img][aria-label]')) && document.querySelector('[role=tab][aria-selected=true]')?.textContent.trim() === 'Screenshots');
  await check('screenshot evidence stays separate from ordinary activity', () => document.querySelectorAll('.tile').length === 4 && document.querySelectorAll('.time-row').length === 0);
  await check('coordinates and technical records are not exposed in main gallery', () => !document.body.innerText.includes('0.00000, 0.00000') && !document.body.innerText.includes('time-only blocks'));
  await check('stored screenshot image decodes and renders', () => document.querySelector('.screenshot img')?.naturalWidth === 1);
  await check('deleted screenshots and storage unavailability have distinct labels', () => document.body.innerText.includes('Screenshot deleted.') && document.body.innerText.includes('Screenshot temporarily unavailable.'));
  document.querySelector('[role=tab][aria-selected=true]').focus();
  document.activeElement.dispatchEvent(new KeyboardEvent('keydown', {key:'End', bubbles:true}));
  await check('keyboard End selects and focuses Applications tab', () => document.activeElement?.textContent.trim() === 'Applications' && document.activeElement.getAttribute('aria-selected') === 'true');
  document.activeElement.dispatchEvent(new KeyboardEvent('keydown', {key:'Home', bubbles:true}));
  await check('keyboard Home returns to Screenshots tab', () => document.activeElement?.textContent.trim() === 'Screenshots' && document.activeElement.getAttribute('aria-selected') === 'true');
  document.querySelector('.screenshot').click();
  await check('screenshot details retain zero coordinates and accuracy', () => document.querySelector('dialog[open]')?.innerText.includes('0.00000, 0.00000 (accuracy ±25 m)'));
  document.querySelector('dialog button').click();
  await wait(100);
  click('Applications');
  await check('applications tab aggregates selected worker/day foreground minutes', () => [...document.querySelectorAll('.app-row')].some(row => row.innerText.includes('chrome.exe') && row.innerText.includes('1.50')));
  click('Activity details');
  await check('activity tab preserves every record without image placeholders', () => document.querySelectorAll('.time-row').length === 5 && !document.querySelector('.time-row .screenshot'));
  await check('activity rows preserve seconds, duration and owner controls', () => [...document.querySelectorAll('.time-row')].some(row => /\d\d:\d\d:\d\d/.test(row.innerText) && row.innerText.includes('30s') && row.innerText.includes('33%') && row.querySelector('button')));
  const ordinary = document.querySelectorAll('.time-row')[3];
  ordinary.querySelector('button').click();
  await check('ordinary activity details preserve seconds without claiming missing storage', () => document.querySelector('dialog[open]')?.innerText.includes('30s') && document.querySelector('dialog[open]')?.innerText.includes('No screenshot captured') && !document.querySelector('dialog[open]')?.innerText.includes('temporarily unavailable'));
  document.querySelector('dialog button').click();
  await wait(100);
  click('Screenshots');
  if (role === 'worker') {
    await check('worker has no team chooser and makes no team day request', () => !document.querySelector('.rrow') && !document.querySelector('select[aria-label=Person]') && dayCalls === 0);
  } else {
    await check('people rail uses semantic keyboard-operable buttons', () => document.querySelectorAll('button.rrow').length === 2 && !document.querySelector('button.rrow[role=listitem]'));
    const worker = [...document.querySelectorAll('button.rrow')].find(r => r.innerText.includes('Second Worker'));
    worker.click();
    await check('person selection loads a clear empty day instead of stale screenshots', () => worker.getAttribute('aria-pressed') === 'true' && document.querySelector('[aria-labelledby=day-heading]')?.getAttribute('aria-busy') === 'false' && document.querySelectorAll('.tile').length === 0 && /No (time|screenshots)/i.test(document.body.innerText));
    [...document.querySelectorAll('button.rrow')].find(r => r.innerText.includes('Fixture')).click();
    await check('returning to own person restores their screenshots', () => document.querySelector('[aria-labelledby=day-heading]')?.getAttribute('aria-busy') === 'false' && document.querySelectorAll('.tile').length === 4);
    await check('day timeline represents only the selected person', () => document.querySelectorAll('.day-timeline .seg').length === 1);
  }
  click('Weekly report');
  await check('weekly report and CSV export remain available', () => Boolean(document.querySelector('[aria-labelledby=week-heading] table')) && Boolean(document.querySelector('a[download][href*="/api/reports/hours.csv"]')));
  click('Settings');
  await check('desktop download is moved to settings and uses published version', () => document.body.innerText.includes('Version 0.1.7') && Boolean(document.querySelector('a[download][href*="/updates/windows/x86_64/releases/0.1.7/"]')));
  await check('password change remains available in settings', () => Boolean(document.querySelector('input[autocomplete=current-password]')));
  if (role === 'owner') {
    const panel = document.querySelector('.diagnostic-logs');
    await check('owner panel is collapsed and does not fetch automatically', () => panel && !panel.querySelector('details').open && logCalls === 0);
    panel.querySelector('details').open = true;
    const button = panel.querySelector('button');
    button.click();
    await check('owner loads code, version and HTTP status', () => panel.innerText.includes('sync_failed') && panel.innerText.includes('0.1.2') && panel.innerText.includes('HTTP 503.'));
    await check('worker name is escaped rather than interpreted as HTML', () => panel.innerText.includes('<img src=x') && !panel.querySelector('img'));
    mode = 'empty';
    await check('load control released', () => !button.disabled);
    button.click();
    await check('empty response clears previous events', () => panel.innerText.includes('No diagnostic logs received') && !panel.querySelector('table'));
    mode = 'error';
    await check('empty load control released', () => !button.disabled);
    button.click();
    await check('failed read shows recoverable error without stale events', () => panel.querySelector('[role=alert]')?.textContent.includes('Diagnostics unavailable') && !panel.querySelector('table'));
  } else {
    await check('non-owner has neither diagnostic panel nor diagnostic requests', () => !document.querySelector('.diagnostic-logs') && logCalls === 0);
  }
  click('Day view');
  await check('navigation returns to the same person and task', () => document.querySelector('#day-heading')?.textContent.includes('Fixture') && document.querySelectorAll('.tile').length === 4);
  timelineError = true;
  click('Refresh');
  await check('day read failure explains stale data and preserves previous screenshots', () => [...document.querySelectorAll('[role=alert]')].some(e => e.innerText.includes('Day could not be loaded') && e.innerText.includes('out of date')) && document.querySelectorAll('.tile').length === 4);
  timelineError = false;
  click('Refresh');
  await check('refresh recovers day read and clears stale-data warning', () => !document.querySelector('[role=alert]') && document.querySelector('[aria-labelledby=day-heading]')?.getAttribute('aria-busy') === 'false' && document.querySelectorAll('.tile').length === 4);
  screenshotImage = '/tests/not-an-image';
  click('Refresh');
  await check('failed image fetch explains how to retry instead of leaving an empty preview', () => Boolean(document.querySelector('.image-preview.failed')) && document.querySelector('.image-preview.failed').innerText.includes('Refresh to retry'));
  screenshotImage = screenshotCanvas.toDataURL('image/jpeg');
  click('Refresh');
  await check('refresh can recover an expired image preview', () => document.querySelectorAll('.image-preview.loaded').length === 2 && !document.querySelector('.image-preview.failed'));
  document.documentElement.dataset.testResult = 'passed';
  results.textContent += `\nPASS: ${checks.length} ${role} UI checks. API responses were mocked.`;
} catch (error) {
  document.documentElement.dataset.testResult = 'failed';
  results.textContent += `\nFAIL: ${error.stack || error}`;
}
</script>
</body>
</html>
