[package]
name = "worktrack-managed-agent"
version = "0.2.0"
edition = "2021"

[lib]
name = "worktrack_managed"
path = "src/lib.rs"

[[bin]]
name = "worktrack-svc"
path = "src/bin/worktrack-svc.rs"

[[bin]]
name = "worktrack-session"
path = "src/bin/worktrack-session.rs"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg"] }
xcap = "0.9.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "gzip", "rustls-tls"] }
windows-service = "0.7"
windows = { version = "0.62", features = [
  "Devices_Geolocation",
  "Foundation",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_Environment",
  "Win32_System_IO",
  "Win32_System_LibraryLoader",
  "Win32_System_Pipes",
  "Win32_System_RemoteDesktop",
  "Win32_System_Threading",
  "Win32_System_StationsAndDesktops",
  "Win32_System_WinRT",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = true
strip = true
