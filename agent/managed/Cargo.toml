[package]
name = "worktrack-managed-agent"
version = "0.1.0"
edition = "2021"

[lib]
name = "worktrack_managed"
path = "src/lib.rs"

[[bin]]
name = "worktrack-svc"
path = "src/bin/worktrack-svc.rs"

[[bin]]
name = "worktrack-session"
path = "src/bin/worktrack-session.rs"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

[target.'cfg(windows)'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "gzip", "rustls-tls"] }
windows-service = "0.7"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_System_RemoteDesktop",
  "Win32_System_Threading",
  "Win32_System_StationsAndDesktops",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = true
strip = true
