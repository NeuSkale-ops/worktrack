[package]
name = "worktrack-managed-agent"
version = "0.1.0"
edition = "2021"

[lib]
name = "worktrack_managed"
path = "src/lib.rs"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
lto = true
strip = true
