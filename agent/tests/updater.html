<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><title>Updater UI tests</title><style>#results{white-space:pre-wrap;overflow-wrap:anywhere}aside{padding:16px}</style></head>
<body>
<aside><h1>Updater UI tests (mock IPC)</h1><pre id="results">Running…</pre></aside>
<div id="root"></div>
<script type="module">
// Dev-only entry point. Tests exercise the real React app without a Tauri backend.
const results = document.querySelector('#results');
const checks = [];
const calls = [];
const intervals = [];
const originalInterval = window.setInterval.bind(window);
window.setInterval = (callback, delay, ...args) => {
  intervals.push({ callback, delay });
  return originalInterval(callback, delay, ...args);
};
const offer = { version: '0.1.2', current_version: '0.1.1', body: 'Test release notes', date: null };
const state = {
  authenticated: true, tracking: false, stopping: false, paused: false, elapsed: 0,
  next_capture: 600, queued: 0, rejected: 0, error: null, server: 'mock', update_reserved: false,
  diagnostics_enabled: false, diagnostics_queued: 0, diagnostics_error: null,
  location_enabled: false, location_pending: false, location_error: null,
  update: { phase: 'idle', downloaded: 0, total: null, error: null },
};
let available = offer;
let checkError = null;
let rejectInstall;
let statusGate = null;
let diagnosticResolve;
let diagnosticReject;
const report = { status: 'available', requested_at: '2026-10-22T05:00:00Z', latitude: 12.34, longitude: 56.78, accuracy_m: 42, observed_at: '2026-10-22T04:59:59Z', position_source: 'IPAddress', is_remote_source: true };
let locationGrant = false;
window.__TAURI_INTERNALS__ = {
  async invoke(command, args) {
    calls.push({ command, args });
    if (command === 'plugin:app|version') return '0.1.1';
    if (command === 'status') { if (statusGate) await statusGate; return structuredClone(state); }
    if (command === 'check_update') {
      if (checkError) throw checkError;
      return available;
    }
    if (command === 'install_update') return new Promise((resolve, reject) => { rejectInstall = reject; });
    if (command === 'request_location') { state.location_enabled = locationGrant; return; }
    if (command === 'diagnose_location') {
      if (!state.location_enabled) throw 'Sign in and allow location before diagnosing';
      return new Promise((resolve, reject) => { diagnosticResolve = resolve; diagnosticReject = reject; });
    }
    if (command === 'open_location_settings') return;
    if (['start', 'stop', 'login', 'logout'].includes(command)) return;
    throw new Error(`Unexpected IPC command: ${command}`);
  },
};
const text = () => document.querySelector('.win')?.innerText || '';
const button = label => [...document.querySelectorAll('.win button')].find(node => node.textContent === label);
const wait = milliseconds => new Promise(resolve => setTimeout(resolve, milliseconds));
async function until(predicate, description) {
  const deadline = Date.now() + 15000;
  while (!predicate()) {
    if (Date.now() > deadline) throw new Error(`Timed out: ${description}`);
    await wait(50);
  }
}
async function check(description, predicate) {
  await until(predicate, description);
  checks.push(description);
  results.textContent = checks.map(name => `PASS ${name}`).join('\n');
}
function click(label) {
  const target = button(label);
  if (!target || target.disabled) throw new Error(`Button unavailable: ${label}`);
  target.click();
}
async function refresh() {
  intervals.find(entry => entry.delay === 1000).callback();
  await wait(100);
}
try {
  await import('/src/main.tsx');
  await check('startup discovers update and distinguishes installed/offered versions', () => text().includes('Version 0.1.1') && text().includes('Version 0.1.2') && text().includes('Test release notes'));
  await check('StrictMode performs one startup check', () => calls.filter(call => call.command === 'check_update').length === 1);
  await check('six-hour update interval is registered', () => intervals.some(entry => entry.delay === 21600000));
  await wait(100);
  let releaseStatus;
  statusGate = new Promise(resolve => { releaseStatus = resolve; });
  const beforePoll = calls.filter(call => call.command === 'status').length;
  for (let i = 0; i < 5; i++) intervals.find(entry => entry.delay === 1000).callback();
  await wait(100);
  await check('slow status IPC permits only one pending poll', () => calls.filter(call => call.command === 'status').length === beforePoll + 1);
  releaseStatus(); statusGate = null;
  await wait(100);
  await check('no opt-out controls exist for location or diagnostics', () => !document.querySelector('#location-consent') && !document.querySelector('#diagnostic-consent') && !calls.some(call => ['set_location', 'set_diagnostics'].includes(call.command)));
  await check('signed-in app requests Windows location automatically', () => calls.some(call => call.command === 'request_location'));
  await check('denied location blocks Start and explains the fix', () => text().includes('Turn on Windows location to start') && button('Start tracking')?.disabled && text().includes('Blocked by Windows'));
  await check('location diagnostic never runs automatically', () => !calls.some(call => call.command === 'diagnose_location'));
  click('Run local location diagnostic');
  await check('missing permission reaches native gate and shows safe actionable error', () => text().includes('Sign in and allow location before diagnosing.') && !text().includes('secret-token') && !button('Run local location diagnostic').disabled);
  click('Clear location diagnostic');
  document.querySelector('.consent input').click();
  await check('consent alone cannot start without location', () => button('Start tracking')?.disabled);
  click('Open location settings');
  await check('settings shortcut uses fixed IPC command', () => calls.some(call => call.command === 'open_location_settings'));
  locationGrant = true;
  await until(() => button('Try again') && !button('Try again').disabled, 'retry ready');
  click('Try again');
  await check('granted location unlocks Start', () => !button('Start tracking')?.disabled && text().includes('Windows location permission granted') && !text().includes('Turn on Windows location'));
  await check('disclosure names mandatory location and diagnostics', () => document.querySelector('.win').textContent.includes('Location at each screenshot') && document.querySelector('.win').textContent.includes('Diagnostic logs are required') && text().includes('Diagnostic logs'));
  await check('manual location warning explains local-only sensitive data', () => text().includes('Sensitive coordinates stay local, are not queued or uploaded') && text().includes('not added to diagnostic logs') && text().includes('no separate IP fallback'));
  const diagnosticCount = () => calls.filter(call => call.command === 'diagnose_location').length;
  const beforeDiagnostic = diagnosticCount();
  const diagnosticButton = button('Run local location diagnostic');
  diagnosticButton.click(); diagnosticButton.click();
  await check('diagnostic single flight gates Start, account and updater actions', () => diagnosticCount() === beforeDiagnostic + 1 && button('Run local location diagnostic').disabled && button('Start tracking').disabled && button('Sign out').disabled && button('Renew sign-in').disabled && button('Update now').disabled && button('Check for updates').disabled && text().includes('Requesting local location'));
  diagnosticReject('secret-token native failure');
  await check('diagnostic error recovers without exposing native strings', () => text().includes('Location diagnostic failed: The local test could not complete. Try again.') && !text().includes('secret-token') && !button('Start tracking').disabled);
  click('Run local location diagnostic');
  diagnosticResolve(report);
  await check('report displays status source remote coordinates accuracy and timestamps', () => text().includes('Status: available') && text().includes('Source: IPAddress') && text().includes('Remote source: Yes') && text().includes('Latitude: 12.34') && text().includes('Longitude: 56.78') && text().includes('Accuracy (meters): 42') && text().includes(report.requested_at) && text().includes(report.observed_at));
  click('Clear location diagnostic');
  await check('report can be dismissed', () => !document.querySelector('[aria-label="Local location report"]'));
  click('Run local location diagnostic'); diagnosticResolve({ ...report, status: 'unavailable', latitude: null, longitude: null, accuracy_m: null, observed_at: null, position_source: null, is_remote_source: null });
  await check('unavailable report distinguishes unknown values', () => text().includes('Status: unavailable') && text().includes('Latitude: Unavailable') && text().includes('Remote source: Unknown'));
  click('Renew sign-in'); await until(() => button('Cancel'), 'renew form'); click('Cancel');
  await until(() => button('Run local location diagnostic'), 'renew cancelled');
  await check('renewal clears report', () => !document.querySelector('[aria-label="Local location report"]'));
  click('Run local location diagnostic'); diagnosticResolve(report);
  await until(() => text().includes('Latitude: 12.34'), 'report before start');
  click('Start tracking');
  await check('start clears report', () => !document.querySelector('[aria-label="Local location report"]'));
  await until(() => !button('Run local location diagnostic').disabled, 'start complete');
  click('Run local location diagnostic');
  state.tracking = true; await refresh();
  await check('external tracking keeps Stop usable during diagnostic', () => !button('Stop tracking').disabled && button('Run local location diagnostic').disabled);
  diagnosticResolve(report); await wait(100);
  state.tracking = false; await refresh();
  await check('stale diagnostic cannot return after tracking starts', () => !document.querySelector('[aria-label="Local location report"]'));
  click('Run local location diagnostic'); diagnosticResolve(report);
  await until(() => text().includes('Latitude: 12.34'), 'report before logout');
  click('Sign out');
  await check('logout clears report', () => !document.querySelector('[aria-label="Local location report"]'));
  await until(() => !button('Run local location diagnostic').disabled, 'logout complete');
  click('Run local location diagnostic');
  state.authenticated = false; await refresh(); diagnosticResolve(report); await wait(100);
  state.authenticated = true; await refresh();
  await check('auth loss discards in-flight report across accounts', () => !document.querySelector('[aria-label="Local location report"]'));
  state.diagnostics_enabled = true;
  state.diagnostics_queued = 2;
  state.diagnostics_error = 'Diagnostic upload failed. Retrying in the background.';
  await refresh();
  await check('diagnostic delivery status is separate from tracking errors', () => text().includes('2 diagnostic events waiting') && text().includes('Diagnostic upload failed.') && !document.querySelector('main [role=alert]'));
  click('Later');
  await check('Later hides notes and never installs', () => Boolean(button('Show update')) && !text().includes('Release notes') && !calls.some(call => call.command === 'install_update'));
  click('Show update');
  await check('deferred offer can be reopened', () => text().includes('Test release notes'));
  state.tracking = true;
  await refresh();
  await check('tracking blocks Update now but allows Stop', () => button('Update now')?.disabled && !button('Stop tracking')?.disabled);
  await check('tracking blocks diagnostic', () => button('Run local location diagnostic').disabled);
  state.tracking = false;
  state.stopping = true;
  await refresh();
  await check('unsaved final interval blocks update, Start and sign-out but permits sign-in renewal', () => button('Update now')?.disabled && button('Start tracking')?.disabled && button('Sign out')?.disabled && !button('Renew sign-in')?.disabled && text().includes('Saving the final interval') && !text().includes('All records synced'));
  await check('stopping blocks diagnostic', () => button('Run local location diagnostic').disabled);
  state.stopping = false;
  state.queued = 1;
  await refresh();
  await check('queued records block Update now', () => button('Update now')?.disabled && text().includes('1 records waiting to sync'));
  state.queued = 0;
  await refresh();
  await until(() => button('Update now') && !button('Update now').disabled, 'queue drained');
  await until(() => !button('Start tracking').disabled, 'tracking consent');
  checkError = 'Offline';
  click('Check for updates');
  await check('failed check clears stale offer and leaves tracking usable', () => text().includes('Could not check for updates') && !button('Update now') && !text().includes('Version 0.1.2') && !button('Start tracking').disabled);
  checkError = 'The update feed is unavailable or no release has been published. Ask your administrator to check update publication. You can keep using this version.';
  click('Check for updates');
  await check('unpublished feed explains administrator action without blaming worker connection', () => text().includes('no release has been published') && text().includes('administrator') && !text().includes('Check your connection') && !button('Start tracking').disabled);
  checkError = null;
  available = null;
  click('Check for updates');
  await check('no-update result shows installed version', () => text().includes('You are up to date on version 0.1.1'));
  available = offer;
  click('Check for updates');
  await until(() => button('Update now') && !button('Update now').disabled, 'offer refreshed');
  click('Update now');
  await check('explicit install sends offered version and gates tracking/sign-in', () => calls.some(call => call.command === 'install_update' && call.args.version === '0.1.2') && button('Start tracking').disabled && button('Renew sign-in').disabled && button('Sign out').disabled);
  state.update_reserved = true;
  state.update = { phase: 'downloading', downloaded: 50, total: 100, error: null };
  await refresh();
  await check('backend download progress renders', () => document.querySelector('progress')?.value === 50 && text().includes('50%'));
  await check('reservation disables location retry controls', () => !button('Try again') || button('Try again').disabled);
  await check('install reservation blocks diagnostic', () => button('Run local location diagnostic').disabled);
  state.update.total = null;
  await refresh();
  await check('unknown download size renders indeterminate progress', () => document.querySelector('progress') && !document.querySelector('progress').hasAttribute('value'));
  state.update.phase = 'installing';
  await refresh();
  await check('install phase renders', () => text().includes('Installing update. Please keep WorkTrack open.'));
  state.update_reserved = false;
  state.update = { phase: 'error', downloaded: 50, total: null, error: 'Download interrupted' };
  rejectInstall('Download interrupted');
  await check('installation failure releases controls', () => text().includes('Update could not be installed') && !button('Start tracking').disabled);
  state.authenticated = false;
  state.update_reserved = true;
  await refresh();
  await check('backend reservation disables sign-in fields and button', () => button('Sign in')?.disabled && document.querySelector('input[name=email]')?.disabled);
  await check('signed-out view shows the monitoring summary', () => text().includes('Only while tracking') && text().includes('Never'));
  state.update_reserved = false;
  state.update = { phase: 'unavailable', downloaded: 0, total: null, error: 'UPDATER_UNAVAILABLE: Signed Windows builds only.' };
  checkError = state.update.error;
  await refresh();
  await until(() => button('Check for updates') && !button('Check for updates').disabled, 'reservation released');
  click('Check for updates');
  await check('unsupported build is neutral and sign-in remains available', () => text().includes('App updates are not available in this build') && !document.querySelector('main [role=alert]') && !button('Sign in').disabled && !button('Update now'));
  document.documentElement.dataset.testResult = 'passed';
  results.textContent += `\n\nPASS: ${checks.length} synthetic browser checks. No real updater or Windows installation was exercised.`;
} catch (error) {
  document.documentElement.dataset.testResult = 'failed';
  results.textContent += `\n\nFAIL: ${error.stack || error}`;
  console.error(error);
}
</script>
</body>
</html>
